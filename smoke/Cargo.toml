[package]
name = "sqlite3mc-src-smoke"
version = "0.0.0"
edition = "2021"
publish = false
description = "Compiles and links the vendored amalgamation as a -sys crate would"
default-run = "sqlite3mc-src-smoke"

[dependencies]
sqlite3mc-src = { path = ".." }

[build-dependencies]
cc = "1.2.27"
sqlite3mc-src = { path = ".." }

[lints.rust]
missing_docs = "forbid"
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
