[package]
name = "sqlite3mc-src-wasm"
version = "0.0.0"
edition = "2021"
publish = false
description = "Builds sqlite-wasm-rs's sqlite3mc feature from the vendored amalgamation and exchanges encrypted files with the native build"

[dependencies]
base64 = "0.22"
sqlite-wasm-rs = { version = "0.6", features = ["wasm-bindgen", "sqlite3mc"] }

[dev-dependencies]
sqlite-wasm-vfs = { version = "0.3", features = ["sahpool"] }
sqlite3mc-src = { path = ".." }
wasm-bindgen-test = "0.3"

# Standalone, so the root crate never adopts it as a member.
[workspace]
