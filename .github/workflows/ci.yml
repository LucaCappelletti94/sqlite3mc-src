name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.81"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo test --all-targets
      - run: cargo test --doc

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --manifest-path smoke/Cargo.toml --check
      - run: cargo clippy --manifest-path smoke/Cargo.toml --all-targets -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  compile:
    name: Compile the packaged amalgamation on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # The consumer runs against the unpacked .crate, which holds only what crates.io would serve.
      - name: Package and unpack
        shell: bash
        run: |
          cargo package
          dir=$(tar -tzf target/package/sqlite3mc-src-*.crate | head -n 1 | cut -d/ -f1)
          tar -xzf target/package/sqlite3mc-src-*.crate -C target/package
          cp -r smoke "target/package/$dir/smoke"
          echo "SMOKE_MANIFEST=target/package/$dir/smoke/Cargo.toml" >> "$GITHUB_ENV"
      - run: cargo run --manifest-path "$SMOKE_MANIFEST"
        shell: bash

  release-bytes:
    name: Vendored files match the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./upgrade.sh
      - run: git diff --exit-code
