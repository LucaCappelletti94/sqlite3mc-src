---
name: SQLite3MC release

"on":
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: SQLite3MC release to vendor, such as 2.5.2. Empty means the latest.
        required: false
        type: string
      retry:
        description: Vendor it even if its pull request was closed unmerged.
        required: false
        type: boolean
        default: false

# Every write goes through the app token, so the workflow token stays read-only.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  vendor:
    name: Vendor a SQLite3MC release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # A manual dispatch may select another ref, and only main's tree belongs here. The full history lets
      # release-branch.sh tell human commits on a release branch from the bot's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Pick the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED: ${{ inputs.version }}
          RETRY: ${{ inputs.retry }}
        run: |
          set -euo pipefail
          pinned=$(sed -nE 's/^pub const SQLITE3MC_VERSION: &str = "(.*)";$/\1/p' src/lib.rs)
          if [ -n "$REQUESTED" ]; then
            target=$REQUESTED
            [ "$target" != "$pinned" ] && moved=yes
          else
            target=$(gh release view --repo utelle/SQLite3MultipleCiphers --json tagName --jq '.tagName | ltrimstr("v")')
            newest=$(printf '%s\n%s\n' "$pinned" "$target" | sort -V | tail -n 1)
            [ "$target" != "$pinned" ] && [ "$newest" = "$target" ] && moved=yes
          fi
          echo "pinned $pinned, target $target"
          # A pull request closed unmerged is a rejection, which only a retry dispatch overrides.
          rejected=$(gh pr list --head "sqlite3mc/v$target" --state closed --json mergedAt \
            --jq '[.[] | select(.mergedAt == null)] | length')
          if [ "${moved:-}" = yes ] && [ "$rejected" -gt 0 ] && [ "$RETRY" != true ]; then
            echo "SQLite3MC $target was rejected by closing its pull request, so it is skipped"
            moved=
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"
          [ "${moved:-}" = yes ] && echo "moved=yes" >> "$GITHUB_OUTPUT"
          true

      - if: steps.release.outputs.moved == 'yes'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - if: steps.release.outputs.moved == 'yes'
        env:
          TARGET: ${{ steps.release.outputs.target }}
        run: ./bump.sh "$TARGET"

      # A pull request from the app, unlike one from the workflow token, starts CI
      # and Coverage on it, and so does every later push to its branch.
      - if: steps.release.outputs.moved == 'yes'
        name: Mint an app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - if: steps.release.outputs.moved == 'yes'
        name: Open the pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          VERSION: ${{ steps.release.outputs.target }}
        run: |
          set -euo pipefail
          bot_id=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          ./release-branch.sh "$VERSION"
